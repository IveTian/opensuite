# MailFlare monorepo workspace
# catalog 统一锁定关键依赖版本，避免前端出现两份 React / Tailwind 等
packages:
  - "apps/*"
  - "packages/*"

catalog:
  # 前端
  react: "^19.2.0"
  react-dom: "^19.2.0"
  "@types/react": "^19.2.0"
  "@types/react-dom": "^19.2.0"
  tailwindcss: "^4.3.0"
  "@tailwindcss/vite": "^4.3.0"
  vite: "^8.0.0"
  "@vitejs/plugin-react": "^6.0.0"
  "@heroui/react": "^3.2.1"
  "@heroui/styles": "^3.2.1"

  # 后端 / 共享
  hono: "^4.12.0"
  better-auth: "^1.6.0"
  "@better-auth/cli": "^1.4.21"
  drizzle-orm: "^0.45.0"
  drizzle-kit: "^0.31.0"
  pg: "^8.22.0"
  "@types/pg": "^8.15.0"
  zod: "^4.3.6"

  # 工具
  wrangler: "^4.105.0"
  typescript: "^5.7.3"
